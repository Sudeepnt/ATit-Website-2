<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ATit Hero Options</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#FFFFFF;color:#13353E;font:400 16px/1.5 "Libre Baskerville",Georgia,"Times New Roman",serif}
.grid{max-width:1320px;margin:0 auto;padding:clamp(24px,4vw,56px);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(36px,5vw,72px) clamp(24px,4vw,56px)}
.design{display:grid;gap:12px;align-content:start}
.num{font-size:clamp(1.5rem,2.4vw,2rem);line-height:1}
.hero-art{position:relative;width:100%;aspect-ratio:523/340}
.hs-gl{position:absolute;inset:0;width:100%;height:100%;display:block;-webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(0deg,transparent,#000 4%,#000 96%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(0deg,transparent,#000 4%,#000 96%,transparent);mask-composite:intersect}
.hs-ui{display:none}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;font-size:.9rem}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="grid">
  <article class="design" id="design-1">
    <span class="num">1</span>
    <div class="hero-art look" data-look="night" style="background:#FFFFFF"></div>
  </article>
  <article class="design" id="design-2">
    <span class="num">2</span>
    <div class="hero-art" data-variant="stepped"></div>
  </article>
  <article class="design" id="design-3">
    <span class="num">3</span>
    <div class="hero-art look" data-look="ink" style="background:#FFFFFF"></div>
  </article>
  <article class="design" id="design-4">
    <span class="num">4</span>
    <div class="hero-art" data-variant="tower"></div>
  </article>
  <article class="design" id="design-5">
    <span class="num">5</span>
    <div class="hero-art look" data-look="skyline" style="background:#FFFFFF"></div>
  </article>
  <article class="design" id="design-6">
    <span class="num">6</span>
    <div class="hero-art" data-variant="pair"></div>
  </article>
  <article class="design" id="design-7">
    <span class="num">7</span>
    <div class="hero-art look" data-look="golden" style="background:linear-gradient(180deg,#DDE8EA 0%,#FFFFFF 52%)"></div>
  </article>
  <article class="design" id="design-8">
    <span class="num">8</span>
    <div class="hero-art" data-variant="white"></div>
  </article>
  <article class="design" id="design-9">
    <span class="num">9</span>
    <div class="hero-art look" data-look="model" style="background:radial-gradient(ellipse at 50% 45%,#FFFFFF 0%,#EEF3F4 100%)"></div>
  </article>
  <article class="design" id="design-10">
    <span class="num">10</span>
    <div class="hero-art" data-variant="alive"></div>
  </article>
</main>

<script src="/hero-variants.js?v=3"></script>
<script src="/hero-looks.js?v=5"></script>
<script>
// Ten live scenes are heavy, so each one starts only as it nears the screen.
function start(host) {
  if (host.dataset.look) window.ATHeroLook(host, host.dataset.look);
  else window.ATHeroVariant(host, host.dataset.variant);
  if (!host.classList.contains('gl-on')) {
    var note = document.createElement('div');
    note.className = 'nogl';
    note.textContent = 'This 3D scene needs WebGL. Please open it in a current browser.';
    host.appendChild(note);
  }
}
var starter = new IntersectionObserver(function (entries) {
  entries.forEach(function (e) {
    if (!e.isIntersecting) return;
    starter.unobserve(e.target);
    start(e.target);
  });
}, { rootMargin: '250px 0px' });
document.querySelectorAll('.hero-art').forEach(function (host) { starter.observe(host); });
</script>
</body>
</html>
